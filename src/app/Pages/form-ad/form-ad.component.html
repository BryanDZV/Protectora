<section class="adoption-form">
  <header>
    <a routerLink="/home/adopcion-estado">Volver</a>
    <h1>Solicitud de adopción</h1>
  </header>

  @if (errorMessage()) {
    <p class="error">{{ errorMessage() }}</p>
  }

  @if (selectedAnimal(); as animal) {
    <article class="animal-card">
      <img [src]="animal.foto" [alt]="animal.nombre" />
      <div>
        <h2>{{ animal.nombre }}</h2>
        <p>
          {{ animal.especie }} | {{ animal.rangoEdad }} | {{ animal.ciudad }}
        </p>
      </div>
    </article>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" class="form-grid">
    <label>
      Teléfono
      <input type="text" formControlName="telf" placeholder="600000000" />
    </label>

    <label>
      DNI
      <input type="text" formControlName="dni" placeholder="12345678A" />
    </label>

    <label>
      Ciudad
      <input type="text" formControlName="city" placeholder="Tu ciudad" />
    </label>

    <label>
      Dirección
      <input
        type="text"
        formControlName="direccion"
        placeholder="Calle, número, piso"
      />
    </label>

    <label>
      Código postal
      <input type="number" formControlName="postal" placeholder="08001" />
    </label>

    <label>
      Tipo de vivienda
      <select formControlName="tipoVivienda">
        <option value="Piso">Piso</option>
        <option value="Casa">Casa</option>
        <option value="Finca">Finca</option>
      </select>
    </label>

    <label>
      Situación de vivienda
      <select formControlName="alquilerOCompra">
        <option value="Alquiler">Alquiler</option>
        <option value="Propiedad">Propiedad</option>
      </select>
    </label>

    <label
      ><input type="checkbox" formControlName="petFriendly" /> Soy pet
      friendly</label
    >
    <label
      ><input type="checkbox" formControlName="tieneMascotas" /> Tengo otras
      mascotas</label
    >
    <label
      ><input type="checkbox" formControlName="permisoCasero" /> Tengo permiso
      del casero</label
    >
    <label
      ><input type="checkbox" formControlName="tieneJardin" /> Tengo
      jardín</label
    >
    <label
      ><input type="checkbox" formControlName="acuerdoVisitas" /> Acepto visitas
      de seguimiento</label
    >

    <button type="submit" [disabled]="isSubmitting()">Enviar solicitud</button>
  </form>
</section>
