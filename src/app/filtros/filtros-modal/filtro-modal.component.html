<!-- Muestra este bloque solo si el contexto es 'galeria' -->
<div *ngIf="contexto === 'galeria'">
  <div class="modal-content">
    <h2>{{ "FILTERS.TITLE" | translate }}</h2>

    <!-- Filtro por ciudad -->
    <div class="input-field">
      <label for="ciudad">{{ "FILTERS.CITY" | translate }}</label>
      <select id="ciudad" [(ngModel)]="ciudad">
        <option value="" disabled selected>
          {{ "FILTERS.SELECT_CITY" | translate }}
        </option>
        <!--  Recorre el array de ciudades -->
        <option *ngFor="let ciudad of ciudades">{{ ciudad }}</option>
      </select>
    </div>

    <!--  Filtro por especie -->
    <div class="input-field">
      <label>{{ "FILTERS.SPECIES" | translate }}</label>
      <!--  Recorre lista de especies -->
      <ng-container
        *ngFor="
          let tipo of ['Perro', 'Gato', 'Tortuga', 'Arácnido', 'Ave', 'Reptil']
        "
      >
        <button
          mat-icon-button
          (click)="selectEspecie(tipo)"
          [ngClass]="especie === tipo ? 'filtro-seleccionado' : ''"
        >
          <!--  Imagen dinámica según especie -->
          <img
            [src]="
              'assets/primary_icons/species_square_primary/type_' +
              tipo.toLowerCase() +
              '/' +
              getEspecieImg(tipo)
            "
            [alt]="tipo"
          />
        </button>
      </ng-container>
    </div>

    <!--  Filtro por edad -->
    <div class="input-field">
      <label for="edad">{{ "FILTERS.AGE" | translate }}</label>
      <select id="edad" [(ngModel)]="edad">
        <option value="">{{ "FILTERS.SELECT_AGE" | translate }}</option>
        <!-- 🔁 Recorre el array de edades -->
        <option *ngFor="let edad of edades" [value]="edad">{{ edad }}</option>
      </select>
    </div>

    <!--  Filtro por género -->
    <div class="input-field">
      <label>{{ "FILTERS.GENDER" | translate }}</label>
      <button
        mat-icon-button
        (click)="selectGenero('Hembra')"
        [ngClass]="genero === 'Hembra' ? 'filtro-seleccionado' : ''"
      >
        <img
          src="assets/primary_icons/genre_square/genre_female_square/female@3x.png"
          alt="Hembra"
        />
      </button>
      <button
        mat-icon-button
        (click)="selectGenero('Macho')"
        [ngClass]="genero === 'Macho' ? 'filtro-seleccionado' : ''"
      >
        <img
          src="assets/primary_icons/genre_square/genre_male_square/male@3x.png"
          alt="Macho"
        />
      </button>
    </div>

    <!--Filtro por tamaño -->
    <div class="input-field">
      <label>{{ "FILTERS.SIZE" | translate }}</label>
      <ng-container *ngFor="let tam of ['Pequeño', 'Mediano', 'Grande']">
        <button
          mat-icon-button
          (click)="selectSize(tam)"
          [ngClass]="size === tam ? 'filtro-seleccionado' : ''"
        >
          <img
            [src]="
              'assets/primary_icons/size_square_primary/size_' +
              tam.toLowerCase() +
              '_square/' +
              getSizeImg(tam)
            "
            [alt]="tam"
          />
        </button>
      </ng-container>
    </div>

    <!--  Mensaje si no hay resultados -->
    <div class="no-results" *ngIf="noResultados">
      <p>{{ "FILTERS.NO_RESULTS" | translate }}</p>
    </div>

    <!--  Botones de acción -->
    <div class="buttons">
      <button mat-button (click)="aplicarFiltros()">
        {{ "FILTERS.APPLY" | translate }}
      </button>
      <button mat-button (click)="borrarFiltros()">
        {{ "FILTERS.CLEAR" | translate }}
      </button>
      <button mat-button (click)="cerrarModal()">
        {{ "FILTERS.CLOSE" | translate }}
      </button>
    </div>
  </div>
</div>
<!-- Muestra este bloque solo si el contexto es 'adopcion' -->
<div *ngIf="contexto === 'adopcion'">
  <div class="modal-content">
    <h2>{{ "FILTERS.ADOPTION_TITLE" | translate }}</h2>

    <!-- Filtro por estado -->
    <div class="input-field">
      <label>{{ "FILTERS.STATUS" | translate }}</label>
      <ng-container *ngFor="let estado of estadosAdopcion">
        <button
          mat-button
          (click)="selectEstadoAdopcion(estado)"
          [ngClass]="estadoAdopcion === estado ? 'filtro-seleccionado' : ''"
        >
          {{ estado }}
        </button>
      </ng-container>
    </div>

    <!-- Mensaje si no hay resultados -->
    <div class="no-results" *ngIf="noResultados">
      <p>{{ "FILTERS.NO_RESULTS_STATUS" | translate }}</p>
    </div>

    <!-- Botones de acción -->
    <div class="buttons">
      <button mat-button (click)="aplicarFiltros()">
        {{ "FILTERS.APPLY" | translate }}
      </button>
      <button mat-button (click)="borrarFiltros()">
        {{ "FILTERS.CLEAR" | translate }}
      </button>
      <button mat-button (click)="cerrarModal()">
        {{ "FILTERS.CLOSE" | translate }}
      </button>
    </div>
  </div>
</div>
