<!-- Muestra este bloque solo si el contexto es 'galeria' -->
<div *ngIf="contexto === 'galeria'">
  <div class="modal-content">
    <h2>Filtro de animales</h2>

    <!-- Filtro por ciudad -->
    <div class="input-field">
      <label for="ciudad">Ciudad:</label>
      <select id="ciudad" [(ngModel)]="ciudad">
        <option value="" disabled selected>Selecciona la ciudad</option>
        <!--  Recorre el array de ciudades -->
        <option *ngFor="let ciudad of ciudades">{{ ciudad }}</option>
      </select>
    </div>

    <!--  Filtro por especie -->
    <div class="input-field">
      <label>Especie:</label>
      <!--  Recorre lista de especies -->
      <ng-container
        *ngFor="
          let tipo of ['Perro', 'Gato', 'Tortuga', 'Arácnido', 'Ave', 'Reptil']
        "
      >
        <button
          mat-icon-button
          (click)="selectEspecie(tipo)"
          [ngClass]="especie === tipo ? 'filtro-seleccionado' : ''"
        >
          <!--  Imagen dinámica según especie -->
          <img
            [src]="
              'assets/primary_icons/species_square_primary/type_' +
              tipo.toLowerCase() +
              '/' +
              getEspecieImg(tipo)
            "
            [alt]="tipo"
          />
        </button>
      </ng-container>
    </div>

    <!--  Filtro por edad -->
    <div class="input-field">
      <label for="edad">Edad:</label>
      <select id="edad" [(ngModel)]="edad">
        <option value="">Selecciona la edad</option>
        <!-- 🔁 Recorre el array de edades -->
        <option *ngFor="let edad of edades" [value]="edad">{{ edad }}</option>
      </select>
    </div>

    <!--  Filtro por género -->
    <div class="input-field">
      <label>Género:</label>
      <button
        mat-icon-button
        (click)="selectGenero('Hembra')"
        [ngClass]="genero === 'Hembra' ? 'filtro-seleccionado' : ''"
      >
        <img
          src="assets/primary_icons/genre_square/genre_female_square/female@3x.png"
          alt="Hembra"
        />
      </button>
      <button
        mat-icon-button
        (click)="selectGenero('Macho')"
        [ngClass]="genero === 'Macho' ? 'filtro-seleccionado' : ''"
      >
        <img
          src="assets/primary_icons/genre_square/genre_male_square/male@3x.png"
          alt="Macho"
        />
      </button>
    </div>

    <!--Filtro por tamaño -->
    <div class="input-field">
      <label>Tamaño:</label>
      <ng-container *ngFor="let tam of ['Pequeño', 'Mediano', 'Grande']">
        <button
          mat-icon-button
          (click)="selectSize(tam)"
          [ngClass]="size === tam ? 'filtro-seleccionado' : ''"
        >
          <img
            [src]="
              'assets/primary_icons/size_square_primary/size_' +
              tam.toLowerCase() +
              '_square/' +
              getSizeImg(tam)
            "
            [alt]="tam"
          />
        </button>
      </ng-container>
    </div>

    <!--  Mensaje si no hay resultados -->
    <div class="no-results" *ngIf="noResultados">
      <p>No hay animales con esos filtros.</p>
    </div>

    <!--  Botones de acción -->
    <div class="buttons">
      <button mat-button (click)="aplicarFiltros()">Aplicar Filtros</button>
      <button mat-button (click)="borrarFiltros()">Borrar Filtros</button>
      <button mat-button (click)="cerrarModal()">Cerrar</button>
    </div>
  </div>
</div>
<!-- Muestra este bloque solo si el contexto es 'adopcion' -->
<div *ngIf="contexto === 'adopcion'">
  <div class="modal-content">
    <h2>Filtrar por estado de adopción</h2>

    <!-- Filtro por estado -->
    <div class="input-field">
      <label>Estado:</label>
      <ng-container *ngFor="let estado of estadosAdopcion">
        <button
          mat-button
          (click)="selectEstadoAdopcion(estado)"
          [ngClass]="estadoAdopcion === estado ? 'filtro-seleccionado' : ''"
        >
          {{ estado }}
        </button>
      </ng-container>
    </div>

    <!-- Mensaje si no hay resultados -->
    <div class="no-results" *ngIf="noResultados">
      <p>No hay animales con ese estado.</p>
    </div>

    <!-- Botones de acción -->
    <div class="buttons">
      <button mat-button (click)="aplicarFiltros()">Aplicar Filtros</button>
      <button mat-button (click)="borrarFiltros()">Borrar Filtros</button>
      <button mat-button (click)="cerrarModal()">Cerrar</button>
    </div>
  </div>
</div>
